  <!-- Mini reproductor inferior -->
  <div class="mini-player">
    <div class="mini-player-content">
      <div class="mini-cover-container">
        <img id="mini-album-cover" class="mini-album-cover" src="portada.jpg" alt="Portada">
      </div>
      
      <div class="mini-info">
        <div id="mini-song-title" class="mini-song-title">Cargando título...</div>
        <div id="mini-artist-name" class="mini-artist-name">Cargando artista...</div>
      </div>
      
      <div class="mini-controls">
        <button id="mini-play-button" class="mini-play-button" onclick="togglePlayStop()">
          <svg class="mini-play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="25" height="25">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="mini-pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="25" height="25" style="display: none;">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Toggle de tema en esquina superior izquierda -->

  <!-- Controles superiores derechos -->

    <!-- Indicador EN VIVO -->

    </div>
    
    <!-- Control de volumen flotante -->

      <!-- Botón flotante -->

        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
